<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB ACE TRAINING</title>
<style>
/* ═══════════════════════════════════════
   BASE
═══════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --accent: #00ff41;
  --accent2: #00cc33;
  --bg: #000;
  --text: #00ff41;
  --font: 'Consolas','Courier New',monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  transition: background 0.5s, color 0.5s;
}

/* ── スキン別ボディ背景 ── */
body.skin-gray       { --bg:#1a1a1a; --text:#e0e0e0; --accent:#aaaaaa; background:#1a1a1a; color:#e0e0e0; }
body.skin-beige      { --bg:#f5f0e8; --text:#4a4030; --accent:#8a7050; background:#f5f0e8; color:#4a4030; }
body.skin-ivory      { --bg:#fffff0; --text:#505040; --accent:#909070; background:#fffff0; color:#505040; }
body.skin-smokeblue  { --bg:#1c2535; --text:#a0b8d0; --accent:#5090c0; background:#1c2535; color:#a0b8d0; }
body.skin-darknavy   { --bg:#0a0e1a; --text:#8899bb; --accent:#4466aa; background:#0a0e1a; color:#8899bb; }
body.skin-brown      { --bg:#2a1f14; --text:#c8a878; --accent:#a07840; background:#2a1f14; color:#c8a878; }
body.skin-lightgray  { --bg:#e8e8e8; --text:#404040; --accent:#888888; background:#e8e8e8; color:#404040; }
body.skin-silver     { --bg:#d0d0d8; --text:#303040; --accent:#6070a0; background:#d0d0d8; color:#303040; }
body.skin-bluegray   { --bg:#2a3545; --text:#a0b8cc; --accent:#5080a0; background:#2a3545; color:#a0b8cc; }
body.skin-slate      { --bg:#3a4050; --text:#c0c8d8; --accent:#7080a0; background:#3a4050; color:#c0c8d8; }
body.skin-purple     { --bg:#1a0a2e; --text:#c0a0ff; --accent:#8844ff; background:linear-gradient(135deg,#1a0a2e,#0a1a40); color:#c0a0ff; }
body.skin-neonviolet { --bg:#120820; --text:#e080ff; --accent:#cc44ff; background:linear-gradient(135deg,#120820,#080a30); color:#e080ff; }
body.skin-geoline    { --bg:#0a1020; --text:#8090ff; --accent:#4455dd; background:#0a1020; color:#8090ff; }
body.skin-darkred    { --bg:#120000; --text:#ff6060; --accent:#cc2020; background:#120000; color:#ff6060; }
body.skin-smokered   { --bg:#1a0808; --text:#ff8870; --accent:#dd3320; background:#1a0808; color:#ff8870; }
body.skin-goldblack  { --bg:#050300; --text:#ffd700; --accent:#ffaa00; background:radial-gradient(ellipse at center,#0f0800,#000); color:#ffd700; }

/* ═══════════════════════════════════════
   背景演出（ディメンションハッキング）
═══════════════════════════════════════ */
#matrix-bg {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.matrix-char {
  position: absolute;
  font-family: 'Consolas','Courier New',monospace;
  font-size: 14px;
  color: var(--accent);
  opacity: 0;
  white-space: nowrap;
  animation: matrixFade linear forwards;
}
@keyframes matrixFade {
  0%   { opacity:0; }
  10%  { opacity:0.35; }
  80%  { opacity:0.25; }
  100% { opacity:0; }
}

/* ═══════════════════════════════════════
   フラッシュ演出
═══════════════════════════════════════ */
#flash-overlay {
  position: fixed; inset: 0;
  opacity: 0; pointer-events: none;
  z-index: 9999;
  transition: opacity 0.15s;
}

/* ═══════════════════════════════════════
   確認ダイアログ
═══════════════════════════════════════ */
#confirm-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 5000;
  display: flex; align-items: center; justify-content: center;
}
#confirm-modal.hidden { display: none !important; }
#confirm-box {
  border: 1px solid var(--accent);
  background: var(--bg);
  padding: 28px 32px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  box-shadow: 0 0 30px var(--accent);
}
#confirm-box p { font-size:14px; letter-spacing:2px; line-height:2; margin-bottom:16px; }
#confirm-box .btn-row { display:flex; gap:12px; justify-content:center; }

/* ═══════════════════════════════════════
   ガチャ結果モーダル
═══════════════════════════════════════ */
#gacha-result-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 5000;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
#gacha-result-modal.hidden { display:none !important; }
#gacha-result-box {
  text-align: center;
  padding: 32px;
  border: 1px solid var(--accent);
  background: var(--bg);
  max-width: 360px;
  width: 90%;
  box-shadow: 0 0 40px var(--accent);
  animation: resultPop 0.4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes resultPop {
  from { transform:scale(0.5); opacity:0; }
  to   { transform:scale(1);   opacity:1; }
}
#gacha-result-rarity {
  font-size: 13px; letter-spacing: 4px; margin-bottom: 10px;
}
#gacha-result-icon {
  font-size: 64px; margin: 10px 0;
}
#gacha-result-name {
  font-size: 20px; font-weight: bold; letter-spacing: 3px; margin-bottom: 8px;
}
#gacha-result-note {
  font-size: 11px; letter-spacing: 2px; color: #aaa; margin-bottom: 20px;
}
#gacha-result-btns { display:flex; gap:10px; justify-content:center; }

/* ═══════════════════════════════════════
   LAYOUT
═══════════════════════════════════════ */
#app {
  position: relative; z-index: 10;
  width: 100%; max-width: 480px;
  padding: 16px 20px;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  min-height: 100vh; justify-content: center;
}

/* ── ヘッダー ── */
#header {
  text-align: center;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  width: 100%; padding-bottom: 10px;
}
#header h1 {
  font-size: 20px; letter-spacing: 5px;
  text-shadow: 0 0 12px var(--accent), 0 0 24px color-mix(in srgb,var(--accent) 50%,transparent);
}
#header-sub {
  font-size: 11px; color: color-mix(in srgb,var(--accent) 60%,transparent);
  margin-top: 4px; letter-spacing: 2px;
  display: flex; justify-content: center; gap: 16px;
}

/* ═══════════════════════════════════════
   ロビー
═══════════════════════════════════════ */
#lobby-screen {
  width: 100%; display: flex; flex-direction: column;
  align-items: center; gap: 12px;
}
.lobby-title {
  font-size: 18px; letter-spacing: 5px;
  text-shadow: 0 0 10px var(--accent);
  margin-bottom: 4px;
}
.lobby-info {
  font-size: 11px; letter-spacing: 2px;
  color: color-mix(in srgb,var(--accent) 70%,transparent);
  line-height: 2;
  text-align: center;
}
.lobby-btns {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; margin-top: 8px;
}
.lobby-btns .btn-full { grid-column: 1/-1; }

/* ═══════════════════════════════════════
   トレーニング
═══════════════════════════════════════ */
#training-screen { width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
#training-screen.hidden { display:none !important; }

#progress-wrap { width:100%; }
#progress-text {
  font-size:11px; color:color-mix(in srgb,var(--accent) 60%,transparent);
  letter-spacing:2px; margin-bottom:5px;
  display:flex; justify-content:space-between;
}
#progress-bar-outer { width:100%; height:3px; background:color-mix(in srgb,var(--accent) 15%,transparent); border-radius:2px; }
#progress-bar-inner { height:100%; background:var(--accent); box-shadow:0 0 6px var(--accent); border-radius:2px; transition:width 0.5s ease; }

#task-card {
  width:100%; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  background:color-mix(in srgb,var(--accent) 4%,transparent);
  padding:20px; text-align:center; position:relative;
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 10%,transparent),
             inset 0 0 20px color-mix(in srgb,var(--accent) 5%,transparent);
}
#task-card::before,#task-card::after {
  content:''; position:absolute; width:10px; height:10px;
  border-color:var(--accent); border-style:solid;
}
#task-card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
#task-card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

/* ガラス風コスメ */
body.cosme-glass #task-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 4px 24px rgba(255,255,255,0.1), inset 0 0 20px rgba(255,255,255,0.05);
}
/* 水玉背景コスメ */
body.cosme-dots #task-card {
  background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 20px 20px;
}
/* ダイヤ柄コスメ */
body.cosme-diamond #task-card {
  background-image: repeating-linear-gradient(45deg,rgba(255,255,255,0.05) 0px,rgba(255,255,255,0.05) 1px,transparent 1px,transparent 14px),
                    repeating-linear-gradient(-45deg,rgba(255,255,255,0.05) 0px,rgba(255,255,255,0.05) 1px,transparent 1px,transparent 14px);
}
/* 幾何学ラインコスメ */
body.cosme-geoline #task-card {
  background-image: repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(128,144,255,0.08) 24px,rgba(128,144,255,0.08) 25px),
                    repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(128,144,255,0.08) 24px,rgba(128,144,255,0.08) 25px);
}
/* マグマコスメ - animationをtask-card自体に使わず疑似要素で演出 */
body.cosme-magma #task-card {
  background: radial-gradient(ellipse at bottom, rgba(200,30,0,0.25) 0%, rgba(10,0,0,0.8) 70%);
  border-color: #cc2020;
  box-shadow: 0 0 30px rgba(200,30,0,0.3), inset 0 0 20px rgba(200,30,0,0.1);
}
body.cosme-magma #task-card::after {
  animation: magmaPulse 3s ease-in-out infinite;
  border-color: #cc2020;
}
@keyframes magmaPulse {
  0%,100% { box-shadow: 0 0 8px rgba(200,30,0,0.5); opacity:0.7; }
  50%     { box-shadow: 0 0 20px rgba(200,30,0,1);   opacity:1; }
}
/* エゴ爆発コスメ - 同様にtask-card自体にanimationを使わない */
body.cosme-ego #task-card {
  box-shadow: 0 0 20px rgba(220,30,0,0.4), 0 0 60px rgba(220,30,0,0.1);
}
body.cosme-ego #task-card::after {
  animation: egoPulse 2s ease-in-out infinite;
  border-color: #dd2000;
}
@keyframes egoPulse {
  0%,100% { box-shadow: 0 0 8px rgba(220,30,0,0.6);  opacity:0.7; }
  50%     { box-shadow: 0 0 22px rgba(220,60,0,1);    opacity:1; }
}
/* タイマー独立レイヤー設定は下の#timer-displayに統合 */
/* 王冠オーバーレイコスメ */
body.cosme-crown::after {
  content: '♛';
  position: fixed; top: 14px; right: 18px;
  font-size: 46px; color: #ffd700; opacity: 0.85;
  z-index: 20; pointer-events: none;
  text-shadow: 0 0 16px #ffd700, 0 0 32px #ffaa0099, 0 0 60px #ffd70044;
  animation: crownFloat 3.5s ease-in-out infinite, crownFlash 6s ease-in-out infinite;
  transform-origin: center center;
}
@keyframes crownFloat {
  0%,100% { transform: translateY(0px);   }
  50%     { transform: translateY(-7px);  }
}
@keyframes crownFlash {
  0%,60%,100% { opacity:0.85; text-shadow: 0 0 16px #ffd700, 0 0 32px #ffaa0099, 0 0 60px #ffd70044; filter: brightness(1); }
  65%         { opacity:1;    text-shadow: 0 0 24px #fff,    0 0 48px #ffd700,   0 0 90px #ffd700,   0 0 120px #ffaa00; filter: brightness(1.8); }
  70%         { opacity:0.85; text-shadow: 0 0 16px #ffd700, 0 0 32px #ffaa0099, 0 0 60px #ffd70044; filter: brightness(1); }
  75%         { opacity:1;    text-shadow: 0 0 20px #fff,    0 0 40px #ffd700,   0 0 80px #ffd700;   filter: brightness(1.5); }
  80%,100%    { opacity:0.85; text-shadow: 0 0 16px #ffd700, 0 0 32px #ffaa0099, 0 0 60px #ffd70044; filter: brightness(1); }
}
/* 流れる数字コスメ（トレーニング中のみ） */
body.cosme-digits #timer-display {
  animation: digitGlow 1.2s ease-in-out infinite;
  position: relative;
}
body.cosme-digits #timer-display.danger {
  animation: digitGlow 1.2s ease-in-out infinite, pulse-danger 0.5s ease-in-out infinite;
}
@keyframes digitGlow {
  0%,100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffaa0080; filter: brightness(1); }
  50%     { text-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700, 0 0 90px #ffaa00; filter: brightness(1.15); }
}

/* ── グリッチブレ：::before / ::after で色ズレ幻影 ── */
body.cosme-digits #timer-display::before,
body.cosme-digits #timer-display::after {
  content: attr(data-val);
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  font-family: inherit; font-size: inherit; font-weight: inherit;
  letter-spacing: inherit; line-height: inherit;
  pointer-events: none;
  opacity: 0;
}
body.cosme-digits #timer-display::before {
  color: #00ffff;
  clip-path: polygon(0 0%, 100% 0%, 100% 35%, 0 35%);
  animation: glitchBefore 0.9s steps(1) infinite;
}
body.cosme-digits #timer-display::after {
  color: #ff00aa;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  animation: glitchAfter 1.3s steps(1) infinite;
}
@keyframes glitchBefore {
  0%          { opacity:0.85; transform: translate(-5px, 1px);  }
  10%         { opacity:0;    transform: translate(0,0);         }
  15%         { opacity:0.9;  transform: translate(4px,-2px);   }
  22%         { opacity:0.7;  transform: translate(-6px, 3px);  }
  30%         { opacity:0;    transform: translate(0,0);         }
  38%         { opacity:0.8;  transform: translate(3px,-4px);   }
  45%         { opacity:0.6;  transform: translate(-3px, 1px);  }
  50%         { opacity:0;    transform: translate(0,0);         }
  58%         { opacity:0.9;  transform: translate(5px, 2px);   }
  65%         { opacity:0;    transform: translate(0,0);         }
  72%         { opacity:0.75; transform: translate(-4px,-2px);  }
  80%         { opacity:0.85; transform: translate(6px, 1px);   }
  88%         { opacity:0;    transform: translate(0,0);         }
  94%         { opacity:0.9;  transform: translate(-5px, 3px);  }
  100%        { opacity:0.85; transform: translate(-5px, 1px);  }
}
@keyframes glitchAfter {
  0%          { opacity:0.8;  transform: translate(5px,-1px);   }
  8%          { opacity:0;    transform: translate(0,0);         }
  16%         { opacity:0.85; transform: translate(-4px, 3px);  }
  24%         { opacity:0.7;  transform: translate(6px,-2px);   }
  33%         { opacity:0;    transform: translate(0,0);         }
  40%         { opacity:0.9;  transform: translate(-5px, 1px);  }
  50%         { opacity:0;    transform: translate(0,0);         }
  55%         { opacity:0.75; transform: translate(4px,-3px);   }
  63%         { opacity:0.85; transform: translate(-6px, 2px);  }
  70%         { opacity:0;    transform: translate(0,0);         }
  78%         { opacity:0.8;  transform: translate(5px,-1px);   }
  86%         { opacity:0.9;  transform: translate(-3px, 4px);  }
  93%         { opacity:0;    transform: translate(0,0);         }
  100%        { opacity:0.8;  transform: translate(5px,-1px);   }
}

/* グリッチフラッシュ瞬間（tick時） */
#timer-display.digit-flash {
  color: #fff !important;
  text-shadow: 0 0 30px #fff, 0 0 60px #ffd700, 0 0 100px #ffd700 !important;
  filter: brightness(2) !important;
  transition: none !important;
}
body.cosme-digits #timer-display.digit-flash::before {
  opacity: 1 !important;
  transform: translate(-6px, 0) !important;
  animation: none !important;
}
body.cosme-digits #timer-display.digit-flash::after {
  opacity: 1 !important;
  transform: translate(6px, 0) !important;
  animation: none !important;
}

#task-label { font-size:11px; letter-spacing:4px; color:color-mix(in srgb,var(--accent) 50%,transparent); margin-bottom:6px; }
#task-name  { font-size:24px; font-weight:bold; letter-spacing:2px; text-shadow:0 0 10px var(--accent); margin-bottom:4px; line-height:1.3; }
#task-name.rest-mode { color:#00ccff; text-shadow:0 0 10px #00ccff; }
#task-reps  { font-size:13px; color:color-mix(in srgb,var(--accent) 60%,transparent); letter-spacing:2px; margin-bottom:14px; min-height:18px; }

#next-preview { font-size:11px; color:color-mix(in srgb,var(--accent) 40%,transparent); letter-spacing:2px; margin-bottom:14px; min-height:16px; }
#next-preview span { color:color-mix(in srgb,var(--accent) 60%,transparent); }

#timer-display {
  font-family: 'Consolas','Courier New',monospace;
  font-size:80px; font-weight:bold; line-height:1; letter-spacing:4px;
  text-shadow:0 0 20px var(--accent),0 0 40px color-mix(in srgb,var(--accent) 50%,transparent);
  transition: color 0.3s;
  will-change: transform;
  isolation: isolate;
  position: relative;
  z-index: 5;
}
#timer-display.danger {
  color:#ff4444;
  text-shadow:0 0 20px #ff4444,0 0 40px rgba(255,68,68,0.5);
  animation:pulse-danger 0.5s ease-in-out infinite;
}
@keyframes pulse-danger { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

/* ═══════════════════════════════════════
   ガチャ画面
═══════════════════════════════════════ */
.gacha-header { font-size:18px; letter-spacing:5px; text-align:center; text-shadow:0 0 10px var(--accent); }
.gacha-info-box {
  width:100%; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  padding:14px; font-size:11px; letter-spacing:2px;
  color:color-mix(in srgb,var(--accent) 70%,transparent); line-height:2.2;
}
.rate-row { display:flex; justify-content:space-between; }
.rate-rare   { color:#7ecf7e; }
.rate-super  { color:#70b8f0; }
.rate-epic   { color:#c070f0; }
.rate-mythic { color:#f07070; }
.rate-legend { color:#f0d060; }
.free-badge {
  display:inline-block; padding:2px 8px;
  border:1px solid #7ecf7e; color:#7ecf7e;
  font-size:10px; letter-spacing:2px; margin-left:8px;
}

/* ═══════════════════════════════════════
   ロッカー / 交換所
═══════════════════════════════════════ */

.tab-bar { display:flex; width:100%; gap:0; }
.tab-btn {
  flex:1; padding:9px; font-family:var(--font); font-size:12px; letter-spacing:2px;
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  background:transparent; color:color-mix(in srgb,var(--accent) 50%,transparent);
  cursor:pointer; transition:all 0.2s;
}
.tab-btn.active {
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  color:var(--accent); border-color:var(--accent);
  box-shadow:0 0 8px color-mix(in srgb,var(--accent) 30%,transparent);
}

.cat-tabs { display:flex; width:100%; gap:6px; flex-wrap:wrap; }
.cat-tab {
  padding:5px 12px; font-family:var(--font); font-size:10px; letter-spacing:2px;
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  background:transparent; color:color-mix(in srgb,var(--accent) 50%,transparent);
  cursor:pointer; transition:all 0.2s;
}
.cat-tab.active { background:color-mix(in srgb,var(--accent) 10%,transparent); color:var(--accent); border-color:var(--accent); }

.item-grid {
  width:100%; display:flex; flex-direction:column; gap:8px;
  max-height: 52vh; overflow-y:auto;
}
.item-grid::-webkit-scrollbar { width:4px; }
.item-grid::-webkit-scrollbar-track { background:transparent; }
.item-grid::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--accent) 40%,transparent); border-radius:2px; }

.item-card {
  display:flex; align-items:center; gap:12px;
  border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
  padding:10px 14px; cursor:pointer; transition:all 0.2s;
  position:relative;
}
.item-card:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.item-card.owned { border-color:color-mix(in srgb,var(--accent) 60%,transparent); }
.item-card.equipped { border-color:var(--accent); box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent); }
.item-card.unowned { opacity:0.45; }

.item-icon { font-size:28px; min-width:36px; text-align:center; }
.item-info { flex:1; }
.item-name { font-size:13px; letter-spacing:2px; margin-bottom:2px; }
.item-rarity { font-size:10px; letter-spacing:2px; }
.item-badge {
  font-size:10px; letter-spacing:2px;

    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    // 装備を常に固定値に上書き
    s.equipped = { skin:'s_goldblack', cosme:'c_crown', font:'f_heavy' };
    return s;
  } catch { return defaultState(); }
}

function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

let state = loadState();

// ═══════════════════════════════════════════════════
// STREAK & COINS
// ═══════════════════════════════════════════════════
const LS_KEY_STREAK = LS_KEY; // 同キー内に統合

function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastDate === today) return state.streak;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  state.streak = (state.lastDate === yesterday) ? state.streak + 1 : 1;
  state.lastDate = today;
  saveState();
  return state.streak;
}



// ═══════════════════════════════════════════════════
// UI 更新
// ═══════════════════════════════════════════════════
function refreshHeader() {
  document.getElementById('streak-val').textContent = state.streak;
}


function updateLobbyInfo() {
  document.getElementById('lobby-info').innerHTML =
    `TOTAL: 62 TASKS<br>約21〜22分`;
}

// ═══════════════════════════════════════════════════
// SKIN / COSME / FONT 適用
// ═══════════════════════════════════════════════════
function getEquippedRarity(cat) {
  const id = state.equipped[cat];
  return id ? (ITEM_MAP[id]?.rarity || null) : null;
}

function applyCosmetics(inTraining) {
  // 引数省略時はDOMの状態から自動判定
  if (inTraining === undefined) {
    inTraining = !document.getElementById('training-screen').classList.contains('hidden');
  }
  const body = document.body;

  // スキンクラスリセット
  body.className = body.className.replace(/skin-\S+/g, '').replace(/cosme-\S+/g, '').replace(/font-\S+/g, '').trim();

  // スキン
  const skinId = state.equipped.skin;
  if (skinId && ITEM_MAP[skinId]) body.classList.add(ITEM_MAP[skinId].skinClass);

  // コスメ（trainOnly はトレーニング画面中のみ適用）
  const cosmeId = state.equipped.cosme;
  if (cosmeId && ITEM_MAP[cosmeId]) {
    const item = ITEM_MAP[cosmeId];
    if (!item.trainOnly || inTraining) body.classList.add(item.cosmeClass);
  }

  // フォント
  const fontId = state.equipped.font;
  if (fontId && ITEM_MAP[fontId]) body.classList.add(ITEM_MAP[fontId].fontClass);
}

// ═══════════════════════════════════════════════════
// 背景演出（ディメンションハッキング）
// ═══════════════════════════════════════════════════
const matrixBg = document.getElementById('matrix-bg');
const DIRECTIONS = ['up','down','left','right'];

function randBinary() {
  const len = Math.floor(Math.random() * 3) + 1;
  let s = '';
  for (let i = 0; i < len; i++) s += Math.random() < 0.5 ? '0' : '1';
  return s;
}

function spawnChar() {
  const el = document.createElement('div');
  el.className = 'matrix-char';
  el.textContent = randBinary();
  const dir = DIRECTIONS[Math.floor(Math.random() * 4)];
  const vw = window.innerWidth, vh = window.innerHeight;
  const dur = 2500 + Math.random() * 2000;
  const dist = 80 + Math.random() * 120;
  let sx = Math.random() * vw, sy = Math.random() * vh, ex = sx, ey = sy;
  if (dir==='up')    ey = sy - dist;
  if (dir==='down')  ey = sy + dist;
  if (dir==='left')  ex = sx - dist;
  if (dir==='right') ex = sx + dist;
  el.style.left = sx+'px'; el.style.top = sy+'px';
  el.style.animationDuration = dur+'ms';
  el.style.fontSize = (11 + Math.random() * 8)+'px';
  matrixBg.appendChild(el);
  el.animate([{left:sx+'px',top:sy+'px'},{left:ex+'px',top:ey+'px'}], {duration:dur,fill:'forwards'});
  setTimeout(() => el.remove(), dur + 100);
}
setInterval(() => { spawnChar(); spawnChar(); }, 100);

// ═══════════════════════════════════════════════════
// FLASH
// ═══════════════════════════════════════════════════
function doFlash(rarity) {
  const el = document.getElementById('flash-overlay');
  const color = FLASH_COLOR[rarity] || FLASH_COLOR.rare;
  el.style.background = color;
  el.style.opacity = '1';
  // ミシック・レジェンドは複数回フラッシュ
  const times = rarity === 'legend' ? 3 : rarity === 'mythic' ? 2 : 1;
  let count = 0;
  const flash = () => {
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; count++; if (count < times) setTimeout(flash, 200); }, 200);
  };
  flash();
}

// ═══════════════════════════════════════════════════
// 画面遷移
// ═══════════════════════════════════════════════════
const SCREENS = ['lobby-screen','training-screen','finish-screen'];

function goToScreen(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  const inTraining = (id === 'training-screen');
  applyCosmetics(inTraining);
  refreshHeader();
  if (id === 'lobby-screen') updateLobbyInfo();
}

// ═══════════════════════════════════════════════════
// TRAINING
// ═══════════════════════════════════════════════════
let currentIdx = 0, timeLeft = 0, timerId = null, running = false;

function isRest(idx) { return tasks[idx]?.name === 'REST'; }

function startTraining() {
  currentIdx = 0; running = false;
  requestWakeLock();
  goToScreen('training-screen');
  document.getElementById('tot-idx').textContent = tasks.length;
  loadTask(0);
}

function loadTask(idx) {
  if (idx >= tasks.length) { finishTraining(); return; }
  currentIdx = idx;
  timeLeft = tasks[idx].duration;
  const t = tasks[idx];
  const nameEl = document.getElementById('task-name');
  nameEl.textContent = t.name;
  nameEl.className = isRest(idx) ? 'rest-mode' : '';
  document.getElementById('task-reps').textContent = t.reps || '';
  document.getElementById('cur-idx').textContent   = idx + 1;

  const nextEl = document.getElementById('next-preview');
  if (idx + 1 < tasks.length) {
    const n = tasks[idx + 1];
    nextEl.innerHTML = `→NEXT: <span>${n.name}</span> ${n.duration}s`;
  } else {
    nextEl.innerHTML = '→NEXT: <span>FINISH</span>';
  }

  const pct = Math.round((idx / tasks.length) * 100);
  document.getElementById('progress-bar-inner').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';

  const skipBtn = document.getElementById('btn-skip');
  isRest(idx) ? skipBtn.classList.remove('hidden') : skipBtn.classList.add('hidden');

  renderTimer();
  if (timerId) { clearInterval(timerId); timerId = null; }
  running = false;

  if (idx === 0) {
    // 最初のタスクだけ手動START
    document.getElementById('btn-startstop').textContent = '▸ START';
  } else {
    // 2タスク目以降は自動開始
    document.getElementById('btn-startstop').textContent = '‖ PAUSE';
    running = true;
    timerId = setInterval(tick, 1000);
  }
  updateTaskListHighlight();
}

function renderTimer() {
  const el = document.getElementById('timer-display');
  const val = String(timeLeft).padStart(2, '0');
  el.textContent = val;
  el.setAttribute('data-val', val); // グリッチ疑似要素用
  timeLeft <= 5 && timeLeft > 0 ? el.classList.add('danger') : el.classList.remove('danger');
}

// ── digits コスメ演出：カウントダウンごとに発火 ──
function triggerDigitsFX() {
  if (state.equipped.cosme !== 'c_digits') return;
  const el = document.getElementById('timer-display');

  // ① グリッチ：実際の数字を一瞬ランダム数字に差し替え
  const real = el.textContent;
  let glitchCount = 0;
  const glitchInterval = setInterval(() => {
    const r1 = Math.floor(Math.random() * 10);
    const r2 = Math.floor(Math.random() * 10);
    el.textContent = `${r1}${r2}`;
    el.setAttribute('data-val', `${r1}${r2}`);
    glitchCount++;
    if (glitchCount >= 4) {
      clearInterval(glitchInterval);
      el.textContent = real;
      el.setAttribute('data-val', real);
    }
  }, 40);

  // ② ビリッと光る
  el.classList.add('digit-flash');
  setTimeout(() => el.classList.remove('digit-flash'), 200);

  // ③ 金色マトリックスをバースト
  for (let i = 0; i < 12; i++) {
    setTimeout(() => spawnGoldChar(), i * 20);
  }
}

function spawnGoldChar() {
  const el = document.createElement('div');
  el.className = 'matrix-char';
  el.style.color = '#ffd700';
  el.style.fontSize = (14 + Math.random() * 12) + 'px';
  el.style.fontWeight = 'bold';
  const len = Math.floor(Math.random() * 3) + 1;
  let s = '';
  for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 10);
  el.textContent = s;
  const dir = DIRECTIONS[Math.floor(Math.random() * 4)];
  const vw = window.innerWidth, vh = window.innerHeight;
  const dur = 800 + Math.random() * 600;
  const dist = 60 + Math.random() * 80;
  let sx = Math.random() * vw, sy = Math.random() * vh, ex = sx, ey = sy;
  if (dir==='up')    ey = sy - dist;
  if (dir==='down')  ey = sy + dist;
  if (dir==='left')  ex = sx - dist;
  if (dir==='right') ex = sx + dist;
  el.style.left = sx+'px'; el.style.top = sy+'px';
  el.style.animationDuration = dur+'ms';
  matrixBg.appendChild(el);
  el.animate([{left:sx+'px',top:sy+'px'},{left:ex+'px',top:ey+'px'}], {duration:dur,fill:'forwards'});
  setTimeout(() => el.remove(), dur + 100);
}

function togglePause() {
  if (currentIdx >= tasks.length) return;
  if (!running) {
    running = true;
    document.getElementById('btn-startstop').textContent = '‖ PAUSE';
    // SE（エピックコスメ）
    const cosmeId = state.equipped.cosme;
    if (cosmeId && ITEM_MAP[cosmeId]?.hasSE) playTick();
    timerId = setInterval(tick, 1000);
  } else {
    running = false;
    document.getElementById('btn-startstop').textContent = '▸ RESUME';
    clearInterval(timerId); timerId = null;
  }
}

function tick() {
  timeLeft--;
  renderTimer();
  triggerDigitsFX();
  if (timeLeft <= 0) {
    clearInterval(timerId); timerId = null; running = false;
    setTimeout(() => loadTask(currentIdx + 1), 400);
  }
}

function skipRest() {
  if (!isRest(currentIdx)) return;
  if (timerId) { clearInterval(timerId); timerId = null; }
  running = false; timeLeft = 0; renderTimer();
  setTimeout(() => loadTask(currentIdx + 1), 200);
}

function resetToLobby() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  running = false; currentIdx = 0;
  releaseWakeLock();
  goToScreen('lobby-screen');
}

function finishTraining() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  running = false;

  const streak = updateStreak();
  releaseWakeLock();

  // 完了フラッシュ（レジェンド=金）
  doFlash('legend');

  document.getElementById('progress-bar-inner').style.width = '100%';
  document.getElementById('progress-pct').textContent = '100%';

  goToScreen('finish-screen');
  document.getElementById('finish-stats').innerHTML =
    `ALL 62 TASKS COMPLETE<br>STREAK: ${streak} DAYS<br>&nbsp;<br>GREAT WORK, ACE.`;
  refreshHeader();
}

// ─── Web Audio SE ───
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTick() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'square';
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}
function playComplete() {
  try {
    const ctx = getAudioCtx();
    [880, 1100, 1320].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t); osc.stop(t + 0.2);
    });
  } catch(e) {}
}



// ═══════════════════════════════════════════════════
// TASK LIST PANEL
// ═══════════════════════════════════════════════════
function buildTaskList() {
  const body = document.getElementById('task-list-body');
  body.innerHTML = '';
  tasks.forEach((t, i) => {
    const div = document.createElement('div');
    const isR = t.name === 'REST';
    div.className = 'tl-item' + (isR ? ' tl-rest' : '');
    div.dataset.idx = i;
    div.innerHTML = isR
      ? `<span class="tl-num">${i+1}</span><span>REST ${t.duration}s</span>`
      : `<span class="tl-num">${i+1}</span><span>${t.name}${t.reps ? ' <span style="opacity:.6;font-size:10px">'+t.reps+'</span>' : ''}</span>`;
    body.appendChild(div);
  });
}

function updateTaskListHighlight() {
  document.querySelectorAll('.tl-item').forEach(el => {
    const i = parseInt(el.dataset.idx);
    el.classList.remove('tl-current','tl-done');
    if (i === currentIdx) el.classList.add('tl-current');
    else if (i < currentIdx) el.classList.add('tl-done');
  });
  const cur = document.querySelector('.tl-item.tl-current');
  if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function toggleTaskList() {
  const panel = document.getElementById('task-list-panel');
  const btn   = document.getElementById('hamburger-btn');
  const ov    = document.getElementById('task-list-overlay');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    btn.classList.remove('open');
    ov.classList.remove('open');
  } else {
    buildTaskList();
    updateTaskListHighlight();
    panel.classList.add('open');
    btn.classList.add('open');
    ov.classList.add('open');
  }
}

function closeTaskList() {
  document.getElementById('task-list-panel').classList.remove('open');
  document.getElementById('hamburger-btn').classList.remove('open');
  document.getElementById('task-list-overlay').classList.remove('open');
}


// ═══════════════════════════════════════════════════
// WAKE LOCK（トレーニング中に画面消灯を防ぐ）
// ═══════════════════════════════════════════════════
let wakeLock = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return; // 非対応ブラウザはスルー
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch(e) {}
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }
}

// タブが非表示→再表示になったとき自動で再取得
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) {
    await requestWakeLock();
  }
});

// INIT
// ═══════════════════════════════════════════════════
applyCosmetics(false);
refreshHeader();
updateLobbyInfo();
